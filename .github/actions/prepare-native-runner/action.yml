name: Prepare native runner storage
description: Reclaim unused hosted toolchains before installing Android dependencies
runs:
  using: composite
  steps:
    - name: Reclaim unused hosted toolchains
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        # API 24+ emulators enforce a 6 GiB userdata minimum and require 20%
        # extra free space at creation. A smaller config.ini size is ignored.
        # These preinstalled toolchains are unused by Wing's Android jobs.
        # Smaller hosted disks also need Swift/PowerShell space after restoring
        # Gradle/Flutter caches and compiling the APK, before creating userdata.
        df -h "$GITHUB_WORKSPACE"
        sudo du -sh /usr/share/swift /opt/microsoft/powershell 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
          /usr/share/swift /opt/microsoft/powershell
        df -h "$GITHUB_WORKSPACE"
