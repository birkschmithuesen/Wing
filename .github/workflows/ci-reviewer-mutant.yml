name: ci-reviewer-mutant
# Throwaway reviewer probe (t_fbb61043): runs the Kotlin unit tests this
# card's JUnit coverage claims to have, since pr-quality.yml only runs
# `flutter test` and the vServer has no local JVM/Android SDK to run
# `gradlew testDebugUnitTest` directly. Mirrors tools/factory/ci-suite.sh's
# disposable-branch dispatch pattern. Delete after use.
on:
  push:
    branches: ['ci-reviewer-mutant/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'
      - name: Run voice-background unit tests
        id: test
        working-directory: android
        continue-on-error: true
        run: |
          gradle testDebugUnitTest \
            --tests "com.tarkilhk.wing.voicebackground.HoldIdleTimerTest" \
            --tests "com.tarkilhk.wing.voicebackground.StopReasonTest" \
            --stacktrace 2>&1 | tee /tmp/test.log
          exit ${PIPESTATUS[0]}

      - name: Surface result as annotations
        if: always()
        working-directory: android
        run: |
          grep -nE "Test .* (PASSED|FAILED)|BUILD (SUCCESSFUL|FAILED)" /tmp/test.log > /tmp/hits.txt || true
          if [ -s /tmp/hits.txt ]; then
            while IFS= read -r line; do printf '::error::RESULT: %s\n' "$line"; done < /tmp/hits.txt
          fi
          grep -n -A30 "FAILURE: Build failed\|What went wrong" /tmp/test.log > /tmp/why.txt || true
          if [ -s /tmp/why.txt ]; then
            head -40 /tmp/why.txt | while IFS= read -r line; do printf '::error::WHY: %s\n' "$line"; done
          else
            tail -n 60 /tmp/test.log | while IFS= read -r line; do printf '::error::TAIL: %s\n' "$line"; done
          fi
          test "${{ steps.test.outcome }}" = "success"
