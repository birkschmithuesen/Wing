name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Build and verify APK
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      RELEASE_TOOLS: ${{ github.workspace }}/release-tools/scripts
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Android runner storage
        uses: ./release-tools/.github/actions/prepare-native-runner

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pinned Android SDK and verification tools
        timeout-minutes: 15
        run: python3 "$RELEASE_TOOLS/install_android_sdk.py" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Preserve SDK install diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-install-release
          path: source/build/sdk-install/
          if-no-files-found: warn
          retention-days: 7

      - name: Allow runner user to accelerate the Android emulator
        run: sudo chmod a+rw /dev/kvm

      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Set up Flutter
        uses: ./release-tools/.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
          pub-cache: false # The dedicated dependency cache below owns pub packages.

      - name: Cache Flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('source/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Runner proofs execute from the tooling checkout, which can differ from
      # the immutable release source. Resolve its own locked dependencies too.
      - name: Install release tooling dependencies
        working-directory: release-tools
        run: flutter pub get --enforce-lockfile

      - name: Make jni native build reproducible (deterministic build-id)
        run: |
          # GNU build-ids hash machine-local DWARF; drop them so the F-Droid
          # rebuild of libdartjni.so is bit-identical.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PUB_CACHE"]) / "hosted/pub.dev/jni-1.0.0/src/CMakeLists.txt"
          t = p.read_text()
          append = '\nif (ANDROID)\n\ttarget_link_options(jni PRIVATE "-Wl,--build-id=none")\nendif()\n'
          if '--build-id=none' not in t:
              p.write_text(t + append)
          print('patched', p)
          PY

      - name: Test release tooling
        run: python3 -m unittest discover -s "$RELEASE_TOOLS/tests" -v

      - name: Verify source version
        run: python3 "$RELEASE_TOOLS/release.py" check

      - name: Test offline QA tooling
        run: python3 -m unittest discover -s tools/qa -p 'test_*.py' -v

      - name: Install transport fixture dependencies
        run: python3 -m pip install -r tools/fake_gateway/requirements.txt

      - name: Test transport fixture boundaries
        run: python3 -m unittest tools.fake_gateway.test_fixture_boundaries -v

      - name: Check all Dart source contracts
        run: python3 scripts/check_commit_linters.py --dart-only

      - name: Check workspace search owner fixtures
        run: dart run tools/architecture/tests/workspace_search_owner_test.dart
      - name: Canonical profile discovery writer fixtures
        run: dart run tools/architecture/tests/profile_discovery_writer_test.dart
      - name: Saved-prompt journal admission fixtures
        run: dart run tools/architecture/tests/saved_prompt_journal_admission_test.dart
      - name: Retired answer versions namespace fixtures
        run: dart run tools/architecture/tests/retired_answer_versions_namespace_test.dart
      - name: Compact activity density fixtures
        run: dart run tools/architecture/tests/activity_density_test.dart
      - name: Current stock tool event fixtures
        run: dart run tools/architecture/tests/current_tool_events_test.dart
      - name: Check authored checkout census
        run: python3 tools/architecture/rules/authored_census.py

      - name: Check authored fixture model catalog
        run: python3 tools/architecture/rules/fixture_model_catalog.py

      - name: Reject retired fixture recovery contracts
        run: python3 tools/architecture/rules/retired_fixture_recovery.py

      - name: Reject retired native resources
        run: python3 tools/architecture/rules/native_retired_resources.py

      - name: Verify release tag and source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 "$RELEASE_TOOLS/release.py" check --tag "$RELEASE_TAG"

      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        run: python3 scripts/test.py --full --skip-linters

      - name: Test opt-in performance measurements
        run: flutter test --no-pub --dart-define=WING_PERF_INSTRUMENTATION=true test/performance_instrumentation_test.dart test/markdown_inline_parser_test.dart test/markdown_parse_worker_test.dart test/background_markdown_content_test.dart test/background_markdown_message_test.dart

      - name: Verify release disables performance instrumentation
        run: |
          mkdir -p build
          dart compile exe -DWING_PERF_INSTRUMENTATION=true -DWING_QA_MARKDOWN_VARIANT=baseline tools/qa/check_release_instrumentation.dart -o build/release-instrumentation-probe
          build/release-instrumentation-probe

      - name: Test diagram preview isolation
        uses: ./release-tools/.github/actions/test-diagram-preview
        with:
          source-directory: source

      - name: Build signed release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WING_STORE_FILE: ${{ runner.temp }}/wing-release.keystore
          WING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 WING_STORE_PASSWORD WING_KEY_PASSWORD WING_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release signing setting: $name" >&2
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$WING_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$WING_STORE_FILE"
          flutter build apk --release --split-per-abi --split-debug-info=symbols

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/wing-release.keystore"

      - name: Test native Android boundaries on the JVM
        run: ./android/gradlew -p android :app:testDebugUnitTest --no-daemon

      - name: Test real Android notification taps with blocked history
        id: notification_device
        timeout-minutes: 15
        run: python3 tools/qa/run_notification_gate.py

      - name: Test Android user journeys and restart recovery
        id: android_journeys
        timeout-minutes: 60
        run: python3 scripts/test_journeys.py

      - name: Upload Android journey diagnostics
        if: failure() && steps.android_journeys.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-journeys-release
          path: source/build/android-journeys/
          if-no-files-found: ignore

      - name: Upload notification emulator diagnostics
        if: failure() && steps.notification_device.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-gate-release
          path: |
            source/build/notification-gate/*.log
            source/build/notification-gate/*.txt
            source/build/notification-gate/*.png
          if-no-files-found: ignore

      - name: Check native share provider and queue boundaries
        run: python3 tools/architecture/native_share/provider_boundary.py

      - name: Prove native share guard fixtures
        run: python3 tools/architecture/native_share/prove_boundary.py

      - name: Native notification retired action
        run: python3 tools/architecture/native_notification/retired_action.py

      - name: Native notification guard fixtures
        run: python3 tools/architecture/native_notification/prove_boundary.py
      - name: Retired native declarations
        run: python3 tools/architecture/native_notification/retired_declaration.py
      - name: Retired native declaration fixtures
        run: python3 tools/architecture/native_notification/prove_declarations.py

      - name: Native voice file boundary
        run: python3 tools/architecture/native_voice/file_api_boundary.py

      - name: Check native voice permission lifecycle ownership
        run: python3 tools/architecture/native_voice/permission_lifecycle.py

      - name: Native voice guard fixtures
        run: python3 tools/architecture/native_voice/prove_boundary.py

      - name: Remove QA APK from distributable output
        # Emulator gates build this owned debug artifact beside signed splits.
        # Keep the verifier's exact distributable-set check intact.
        run: rm -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify release APKs
        run: python3 "$RELEASE_TOOLS/verify_release_apks.py"

      - name: Package release assets
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tarfile
          sys.path.insert(0, os.environ["RELEASE_TOOLS"])
          from release import current_version, release_notes, release_tag

          version, build = current_version()
          tag = release_tag(version)
          assets = Path("release-assets")
          assets.mkdir()
          for apk in sorted(Path("build/app/outputs/flutter-apk").glob("app-*-release.apk")):
              abi = apk.name.removeprefix("app-").removesuffix("-release.apk")
              shutil.copyfile(apk, assets / f"wing-{tag}-{abi}.apk")
          if not list(Path("symbols").glob("*.symbols")):
              raise SystemExit("No Dart debug symbols were produced")
          with tarfile.open(assets / f"wing-{tag}-symbols.tar.gz", "w:gz") as archive:
              archive.add("symbols", arcname="symbols")
          (assets / "release-notes.md").write_text(release_notes(version))
          metadata = {
              "version": tag.removeprefix("v"),
              "android_build_number": build,
              "tag": tag,
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_commit": os.environ["GITHUB_SHA"],
              "package": "com.tarkilhk.wing",
              "certificate_sha256": Path("android/wing-release-certificate.sha256").read_text().strip(),
              "verification": "All APKs passed package, version, non-debuggable and signing certificate checks",
          }
          (assets / "release.json").write_text(json.dumps(metadata, indent=2) + "\n")
          checksums = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in sorted(assets.iterdir())
          ]
          (assets / "SHA256SUMS").write_text("".join(checksums))
          PYTHON

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: source/release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified APKs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Check asset integrity
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      # Existing releases (including drafts) fail here. Never overwrite assets.
      - name: Create draft with all release assets
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "Wing $RELEASE_TAG" \
            --notes-file release-assets/release-notes.md release-assets/*

      - name: Download uploaded assets for verification
        run: gh release download "$RELEASE_TAG" --dir uploaded-assets

      - name: Verify uploaded assets
        run: |
          diff release-assets/SHA256SUMS uploaded-assets/SHA256SUMS
          cd uploaded-assets
          sha256sum --check SHA256SUMS

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false
