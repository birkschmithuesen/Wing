name: Wing Voice APK (unsigned)

# Local side-by-side variant: package com.tarkilhk.wing.voice, label "Wing Voice".
# Produces an UNSIGNED arm64 release APK; signing happens locally with the
# owner's sideload key (never stored in the repo or in Actions secrets).
on:
  workflow_dispatch:
  push:
    branches: [voice-offline]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Tests (voice)
        run: flutter test --no-pub test/voice_preferences_test.dart test/voice_processing_test.dart test/voice_workspace_test.dart
      - name: Build unsigned arm64 APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 -PvoiceVariant=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wing-voice-arm64-unsigned
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
