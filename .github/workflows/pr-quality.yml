name: PR Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # This check name must match the required status in the main ruleset.
    name: Analyze & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Android runner storage
        uses: ./.github/actions/prepare-native-runner

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pinned Android SDK
        timeout-minutes: 15
        run: python3 scripts/install_android_sdk.py "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Preserve SDK install diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-install-quality
          path: build/sdk-install/
          if-no-files-found: warn
          retention-days: 7

      - name: Allow runner user to accelerate the Android emulator
        run: sudo chmod a+rw /dev/kvm

      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # This main-push job seeds the cache consumed by PR/native/nightly jobs.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true
          pub-cache: false # The dedicated dependency cache below owns pub packages.

      - name: Cache Flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get
        id: pub_get

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify source version
        run: python3 scripts/release.py check

      - name: Test offline QA tooling
        run: python3 -m unittest discover -s tools/qa -p 'test_*.py' -v

      - name: Install transport fixture dependencies
        run: python3 -m pip install -r tools/fake_gateway/requirements.txt

      - name: Test transport fixture boundaries
        run: python3 -m unittest tools.fake_gateway.test_fixture_boundaries -v

      - name: Load preceding architecture baseline
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p build
          if [ -n "$BASELINE_REF" ] && git cat-file -e "$BASELINE_REF:tools/architecture/baseline.json" 2>/dev/null; then
            git show "$BASELINE_REF:tools/architecture/baseline.json" > build/architecture-baseline-reference.json
          else
            cp tools/architecture/baseline.json build/architecture-baseline-reference.json
          fi

      - name: Check all Dart source contracts
        run: python3 scripts/check_commit_linters.py --dart-only --baseline-reference "build/architecture-baseline-reference.json"

      - name: Check workspace search owner fixtures
        run: dart run tools/architecture/tests/workspace_search_owner_test.dart
      - name: Check authored checkout census
        run: python3 tools/architecture/rules/authored_census.py

      - name: Check authored fixture model catalog
        run: python3 tools/architecture/rules/fixture_model_catalog.py

      - name: Reject retired fixture recovery contracts
        run: python3 tools/architecture/rules/retired_fixture_recovery.py

      - name: Reject retired native resources
        run: python3 tools/architecture/rules/native_retired_resources.py

      # ── Step 1: Static analysis ──────────────────────────
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-pub --fatal-infos 2>&1 | tee analyze_output.txt
          exit ${PIPESTATUS[0]}

      # ── Step 2: Run tests ────────────────────────────────
      - name: Run product tests and required checker proofs
        id: test
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/test.py --changed-since "$TEST_BASE_REF" --skip-linters

      - name: Test opt-in performance measurements
        run: flutter test --no-pub --dart-define=WING_PERF_INSTRUMENTATION=true test/performance_instrumentation_test.dart test/markdown_inline_parser_test.dart test/markdown_parse_worker_test.dart test/background_markdown_content_test.dart test/background_markdown_message_test.dart

      - name: Verify release disables performance instrumentation
        run: |
          mkdir -p build
          dart compile exe -DWING_PERF_INSTRUMENTATION=true -DWING_QA_MARKDOWN_VARIANT=baseline tools/qa/check_release_instrumentation.dart -o build/release-instrumentation-probe
          build/release-instrumentation-probe

      - name: Compile debug Android APK without release credentials
        id: android_build
        continue-on-error: true
        run: |
          flutter build apk --debug --no-pub 2>&1 | tee android_build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Test native Android boundaries on the JVM
        id: native_test
        run: |
          (cd android && ./gradlew :app:testDebugUnitTest --no-daemon) 2>&1 | tee native_test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Test real Android notification taps with blocked history
        id: notification_device
        timeout-minutes: 15
        run: python3 tools/qa/run_notification_gate.py

      - name: Test Android user journeys and restart recovery
        id: android_journeys
        timeout-minutes: 60
        run: python3 scripts/test_journeys.py

      - name: Upload Android journey diagnostics
        if: failure() && steps.android_journeys.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-journeys-quality
          path: build/android-journeys/
          if-no-files-found: ignore

      - name: Upload notification emulator diagnostics
        if: failure() && steps.notification_device.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-gate-quality
          path: |
            build/notification-gate/*.log
            build/notification-gate/*.txt
            build/notification-gate/*.png
            build/notification-gate/*.json
          if-no-files-found: ignore

      - name: Check native share provider and queue boundaries
        run: python3 tools/architecture/native_share/provider_boundary.py

      - name: Prove native share guard fixtures
        run: python3 tools/architecture/native_share/prove_boundary.py

      - name: Native notification retired action
        run: python3 tools/architecture/native_notification/retired_action.py

      - name: Native notification guard fixtures
        run: python3 tools/architecture/native_notification/prove_boundary.py
      - name: Retired native declarations
        run: python3 tools/architecture/native_notification/retired_declaration.py
      - name: Retired native declaration fixtures
        run: python3 tools/architecture/native_notification/prove_declarations.py

      - name: Native voice file boundary
        run: python3 tools/architecture/native_voice/file_api_boundary.py

      - name: Check native voice permission lifecycle ownership
        run: python3 tools/architecture/native_voice/permission_lifecycle.py

      - name: Native voice guard fixtures
        run: python3 tools/architecture/native_voice/prove_boundary.py

      # ── Step 3: Summary & failure report ─────────────────
      - name: Failure summary
        if: always() && (steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.android_build.outcome != 'success' || steps.native_test.outcome != 'success' || steps.notification_device.outcome != 'success' || steps.android_journeys.outcome != 'success')
        run: |
          echo "## Quality checks failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "### Static analysis failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f analyze_output.txt ]; then
              cat analyze_output.txt >> $GITHUB_STEP_SUMMARY
            else
              echo "Static analysis did not run; see the earlier failed step." >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Static analysis passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "### Tests failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "See the product test step log for the complete failure report." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Host tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Android notification gate: ${{ steps.notification_device.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Android user journeys: ${{ steps.android_journeys.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Failed emulator diagnostics are attached as artifacts." >> $GITHUB_STEP_SUMMARY

          for check in android_build native_test; do
            echo "### $check" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f "${check}_output.txt" ]; then
              cat "${check}_output.txt" >> $GITHUB_STEP_SUMMARY
            else
              echo "No output captured; see the step status." >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          # Surface failure detail as annotations too: the step summary and logs are
          # not fetchable from the egress-blocked vServer, check-run annotations are.
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            grep -E "(info|warning|error) •" analyze_output.txt | head -10 > /tmp/analyze_hits.txt || true
            if [ -s /tmp/analyze_hits.txt ]; then
              while IFS= read -r line; do printf '::error::ANALYZE: %s\n' "$line"; done < /tmp/analyze_hits.txt
            else
              tail -n 20 analyze_output.txt | while IFS= read -r line; do printf '::error::ANALYZE-TAIL: %s\n' "$line"; done
            fi
          fi
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            evidence="$(ls -dt /tmp/wing-host-tests-* 2>/dev/null | head -1)"
            if [ -n "$evidence" ] && [ -f "$evidence/tests.jsonl" ]; then
              grep -h '"type":"error"' "$evidence/tests.jsonl" | head -8 | cut -c1-900 | while IFS= read -r line; do printf '::error::TEST: %s\n' "$line"; done
              tail -n 20 "$evidence/tests.stderr" | while IFS= read -r line; do printf '::error::TEST-STDERR: %s\n' "$line"; done
            fi
          fi
          if [ "${{ steps.native_test.outcome }}" != "success" ] && [ -f native_test_output.txt ]; then
            tail -n 25 native_test_output.txt | while IFS= read -r line; do printf '::error::NATIVE-TEST: %s\n' "$line"; done
          fi
          if [ "${{ steps.android_build.outcome }}" != "success" ] && [ -f android_build_output.txt ]; then
            tail -n 25 android_build_output.txt | while IFS= read -r line; do printf '::error::ANDROID-BUILD: %s\n' "$line"; done
          fi

      # ── Step 4: Pass/fail enforcement ────────────────────
      - name: Enforce checks
        if: always() && (steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.android_build.outcome != 'success' || steps.native_test.outcome != 'success' || steps.notification_device.outcome != 'success' || steps.android_journeys.outcome != 'success')
        run: |
          echo "──────────────────────────────────────────────"
          echo "Quality gate blocked - see summary above."
          echo ""
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "   FAILED: flutter analyze"
          else
            echo "   PASSED:  flutter analyze"
          fi
          echo "   Android debug build: ${{ steps.android_build.outcome }}"
          echo "   Native JVM tests: ${{ steps.native_test.outcome }}"
          echo "   Android notifications: ${{ steps.notification_device.outcome }}"
          echo "   Android journeys: ${{ steps.android_journeys.outcome }}"
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "   FAILED: flutter test"
          else
            echo "   PASSED:  flutter test"
          fi
          echo "──────────────────────────────────────────────"
          exit 1

      - name: All checks passed
        if: steps.analyze.outcome == 'success' && steps.test.outcome == 'success' && steps.android_build.outcome == 'success' && steps.native_test.outcome == 'success' && steps.notification_device.outcome == 'success' && steps.android_journeys.outcome == 'success'
        run: |
          echo "## All quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis: clean" >> $GITHUB_STEP_SUMMARY
          echo "- All tests: passing" >> $GITHUB_STEP_SUMMARY
          echo "- Android debug APK: compiled without release credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Native JVM tests: passing" >> $GITHUB_STEP_SUMMARY
          echo "- Android notifications, user journeys and process recovery: passing" >> $GITHUB_STEP_SUMMARY

  renderer:
    name: Browser Renderer Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test diagram preview isolation
        uses: ./.github/actions/test-diagram-preview
