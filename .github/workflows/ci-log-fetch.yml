name: ci-log-fetch
# One-off: fetches a prior workflow run's job log via gh CLI (unblocked egress on
# the runner) and publishes the tail as an orphan commit on a result branch.
# Triggered by pushing a commit with .ci-log-fetch/request (line 1: run id) to
# ci-log-fetch/**. Temporary tool for diagnosing a CI failure from behind the
# vServer egress firewall; safe to delete after use.
on:
  push:
    branches: ["ci-log-fetch/**"]
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch log tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(sed -n 1p .ci-log-fetch/request)
          gh run view "$run_id" --repo "${{ github.repository }}" --log > /tmp/payload.txt || true
          grep -n -B 5 -A 10 -E "\[E\]|Some tests failed|error •|Expected:|Actual:" /tmp/payload.txt > /tmp/payload_filtered.txt || true
          tail -c 60000 /tmp/payload_filtered.txt > /tmp/payload_trunc.txt
          git config user.name ci-log-fetch
          git config user.email ci-log-fetch@users.noreply.github.com
          git checkout -q --orphan result
          git rm -rq --cached .
          git clean -fdxq
          cp /tmp/payload_trunc.txt payload
          git add payload
          git commit -qm "ci-log-fetch: $run_id"
          git push -f origin "HEAD:${GITHUB_REF}"
