<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'self'; object-src 'none'; worker-src 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>Diagram preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Roboto, sans-serif;
        --canvas: #F7F7F4;
        --panel: #FFFFFF;
        --text: #1B2D36;
        --muted: #586970;
        --border: #D6E0E1;
        --error: #B91C1C;
        --error-surface: #FFF1EF;
        --error-border-opacity: .30;
        --accent: #126D70;
        background: var(--canvas);
      }

      :root[data-theme="dark"] {
        --canvas: #101B24;
        --panel: #192934;
        --text: #EBF1F2;
        --muted: #ADBDC4;
        --border: #344C58;
        --error: #F87171;
        --error-surface: #352422;
        --error-border-opacity: .42;
        --accent: #65C7BC;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        overscroll-behavior: contain;
      }

      body {
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        background: inherit;
      }

      #diagram {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        overflow: visible;
      }

      #diagram svg {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      #diagram img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
      }

      #diagram iframe {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: calc(100vh - 32px);
        border: 0;
        background: #ffffff;
      }

      #status {
        position: relative;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        box-sizing: border-box;
        inline-size: min(100%, 42rem);
        margin-block: 24px;
        margin-inline: auto;
        padding: 12px;
        border-radius: 8px;
        color: var(--text);
        background: var(--error-surface);
        font-size: .875rem;
        font-weight: 600;
        line-height: 1.45;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      #status::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 1px solid var(--error);
        border-radius: inherit;
        opacity: var(--error-border-opacity);
      }

      .status-icon {
        position: relative;
        display: grid;
        place-items: center;
        inline-size: 38px;
        block-size: 38px;
        color: var(--error);
      }

      .status-icon::before {
        content: "";
        position: absolute;
        inset: 0;
        background: currentColor;
        border-radius: 50%;
        opacity: .14;
      }

      #status-message {
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <script>
      // The WebView applies its palette even if the preview script is missing.
      window.setStudioTheme = (dark, palette) => {
        const root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        for (const role of ['canvas', 'panel', 'text', 'muted', 'border', 'error', 'error-surface', 'accent']) {
          if (!/^#[0-9a-f]{6}$/i.test(palette[role])) throw new Error('Invalid Studio palette');
          root.style.setProperty(`--${role}`, palette[role]);
        }
      };
    </script>
    <script defer src="mermaid.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main id="diagram" aria-label="Diagram preview"></main>
    <div id="status" role="alert" hidden>
      <span class="status-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v6m0 2v2"></path>
        </svg>
      </span>
      <p id="status-message">The diagram viewer could not load.</p>
    </div>
  </body>
</html>
