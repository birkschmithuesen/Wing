name: wing
description: "Wing, a mobile client for Hermes profiles, conversations and agent work."
publish_to: 'none'
version: 1.4.0+2497

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_markdown: ^0.7.6
  markdown: ^7.3.1
  re_highlight: 0.0.3
  re_editor: 0.10.0
  characters: 1.4.1

  # Network
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # Local storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: 11.2.0
  path_provider: ^2.1.6
  # Image allocation preflight is audited against this exact codec implementation.
  image: 4.12.0
  file_picker: 13.3.0

  # Data models
  meta: 1.19.0
  uuid: ^4.6.0
  crypto: ^3.0.8
  # Strict stock identity metadata reads and canonical server paths.
  yaml: 3.1.4
  path: 1.9.1

  # Misc
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1

  # Notifications
  flutter_local_notifications: ^22.3.3
  cryptography: ^2.7.0

dev_dependencies:
  # Architecture guards use this analyzer's parsed and resolved APIs.
  analyzer: 10.1.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  fonts:
    - family: WingIcons
      fonts:
        - asset: assets/fonts/wing-icons.ttf
    - family: WingProjectIcons
      fonts:
        - asset: assets/fonts/codicons.ttf
  assets:
    - assets/fonts/CODICONS-LICENSE
    - assets/fonts/TABLER-LICENSE
    - PRIVACY.md
    - assets/icon/icon.png
